<template>
    <div class="slds-grid slds-wrap">
        <nav class="slds-col slds-size_1-of-1">
            <h1 class="slds-text-heading_large" data-id="heading">Scholarships</h1>
            <a href={admissionsHomeUrl} class="slds-text-body_regular" data-id="admissions-home"
               onclick={handleAdmissionsHomeClick}>{admissionsHomeLabel}</a>
        </nav>

        <template lwc:if={fullName}>
            <div class="slds-col slds-size_1-of-1">
                <h2 class="slds-text-heading_medium" data-id="user-line">Scholarships for {fullName}</h2>
            </div>
        </template>

        <div class="slds-col slds-size_1-of-1 slds-m-top_medium">
            <c-scholarship-eligible-list-view></c-scholarship-eligible-list-view>
        </div>
    </div>
