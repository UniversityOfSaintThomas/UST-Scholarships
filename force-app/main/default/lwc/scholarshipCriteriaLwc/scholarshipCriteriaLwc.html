<template>
    <template lwc:if={isLoading}>
        <div class="slds-is-relative slds-p-vertical_xx-large">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template lwc:if={hasConfigWarnings}>
        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert" data-id="config-warnings">
            <ul>
                <template for:each={configWarnings} for:item="warning">
                    <li key={warning}>{warning}</li>
                </template>
            </ul>
        </div>
    </template>

    <template lwc:if={errorMessage}>
        <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert" data-id="error-message">
            {errorMessage}
        </div>
    </template>

    <template lwc:if={hasData}>
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1 slds-p-vertical_x-small">
                <h2 class="slds-text-heading_large"><strong>{scholarshipName}</strong></h2>
            </div>

            <template lwc:if={hasDescription}>
                <div class="slds-col slds-size_1-of-1 slds-p-vertical_x-small" data-id="description">
                    <h2 class="slds-text-heading_medium">Description</h2>
                    <lightning-formatted-rich-text value={pageData.description}></lightning-formatted-rich-text>
                </div>
            </template>

            <template lwc:if={hasCriteria}>
                <div class="slds-col slds-size_1-of-1 slds-p-vertical_x-small" data-id="criteria">
                    <h2 class="slds-text-heading_medium">Eligibility</h2>
                    <lightning-formatted-rich-text value={pageData.criteriaStatement}></lightning-formatted-rich-text>
                </div>
            </template>

            <template lwc:if={selfReportRequired}>
                <div class="slds-p-top_x-small slds-p-bottom_small slds-p-right_small slds-size_1-of-1 slds-size_6-of-12">
                    <div class={gpaWrapperClass}>
                        <lightning-input type="number" step="0.01" label="Self report your GPA:" data-field="gpa"
                                         value={gpa} onchange={handleChange}></lightning-input>
                        <div class="slds-form-element__help" data-id="gpa-help">Please enter a valid GPA (example 3.5).</div>
                        <template lwc:if={gpaError}>
                            <div class="slds-form-element__help slds-text-color_error" role="alert" data-id="gpa-error">{gpaError}</div>
                        </template>
                    </div>
                </div>
                <div class="slds-p-vertical_x-small slds-size_1-of-1 slds-size_6-of-12">
                    <div class={actSatWrapperClass}>
                        <lightning-input type="number" step="1" label="Self report your ACT or SAT:" data-field="actSat"
                                         value={actSat} onchange={handleChange}></lightning-input>
                        <div class="slds-form-element__help" data-id="actsat-help">Please enter a valid ACT/SAT score (example 27).</div>
                        <template lwc:if={actSatError}>
                            <div class="slds-form-element__help slds-text-color_error" role="alert" data-id="actsat-error">{actSatError}</div>
                        </template>
                    </div>
                </div>
            </template>

            <div class="slds-col slds-p-top_x-small slds-p-bottom_medium slds-size_1-of-1">
                <div class={confirmWrapperClass}>
                    <lightning-input type="checkbox" label={confirmLabel} data-field="confirmed"
                                     checked={confirmed} onchange={handleChange}></lightning-input>
                    <div class="slds-form-element__help">You must acknowledge you understand and meet the criteria outlined on this page to proceed. Signify this by checking the confirmation checkbox.</div>
                    <template lwc:if={confirmedError}>
                        <div class="slds-form-element__help slds-text-color_error" role="alert" data-id="confirmed-error">{confirmedError}</div>
                    </template>
                </div>
            </div>

            <div class="slds-col slds-p-vertical_x-small slds-size_1-of-1">
                <lightning-button variant="brand" label="Confirm and Continue" data-id="continue"
                                  disabled={isSaving} onclick={handleSave}></lightning-button>
            </div>
        </div>
    </template>
</template>
