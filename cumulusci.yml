minimum_cumulusci_version: '4.8.1'
project:
  name: UST-Scholarships
  package:
    name: UST-Scholarships
    api_version: '66.0'
  git:
  source_format: sfdx

tasks:
  robot:
    options:
      suites: robot/UST-Scholarships/tests
      options:
        outputdir: robot/UST-Scholarships/results

  robot_testdoc:
    options:
      path: robot/UST-Scholarships/tests
      output: robot/UST-Scholarships/doc/UST-Scholarships_tests.html

  run_tests:
    options:
      required_org_code_coverage_percent: 75

  update_sharing_settings:
    description: Update sharing settings on EASY Application objects
    class_path: cumulusci.tasks.metadata_etl.SetOrgWideDefaults
    options:
      org_wide_defaults:
        - api_name: Application__c
          internal_sharing_model: ReadWrite
          external_sharing_model: ReadWrite
        - api_name: Application_Control__c
          internal_sharing_model: ReadWrite
          external_sharing_model: Read
        - api_name: EASY_Widget__c
          internal_sharing_model: ReadWrite
          external_sharing_model: Read
        - api_name: Interaction__c
          internal_sharing_model: ReadWrite
          external_sharing_model: ReadWrite
        - api_name: Interaction_Mapping__c
          internal_sharing_model: ReadWrite
          external_sharing_model: ReadWrite
        - api_name: Requirement__c
          internal_sharing_model: ReadWrite
          external_sharing_model: Read
        - api_name: Scholarship_Applicant__c
          internal_sharing_model: ReadWrite
          external_sharing_model: ReadWrite
        - api_name: Scholarship__c
          internal_sharing_model: ReadWrite
          external_sharing_model: ReadWrite

  deploy_guest_sharing_rules:
    description: Deploys configuration for Development.
    class_path: cumulusci.tasks.salesforce.Deploy
    options:
      namespace_inject: $project_config.project__package__namespace
      path: unpackaged/sharing

  adjust_custom_settings:
    description: Activate Sites
    class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
    options:
      apex: >
        Site mySite = [SELECT Id FROM Site WHERE Name = 'EASY_Applicant_Portal'];
            SiteDetail mySiteDetail = [SELECT SecureURL FROM SiteDetail WHERE DurableId = :mySite.Id];
            String url = mySiteDetail.SecureURL;
        
            List<Profile> easyProfile = [
                    SELECT Name, Id
                    FROM Profile
                    WHERE Name = 'EASY Applicant Portal Profile'
            ];
        
            List<PermissionSet> easyCommunityPermissionSet = [
                    SELECT Id, Name
                    FROM PermissionSet
                    WHERE Name = 'Application_Community'
            ];
        
            Application_Setting__c applicationSettings = Application_Setting__c.getOrgDefaults();
            applicationSettings.Community_URL__c = url;
        
            if (easyProfile.size() > 0) {
                applicationSettings.Community_Profile_Ids__c = easyProfile[0].Id;
            }
        
            if (easyCommunityPermissionSet.size() > 0) {
                applicationSettings.Permission_Set_Id__c = easyCommunityPermissionSet[0].Id;
            }
        
            applicationSettings.Default_Template__c = 'stthomas2021';
        
            upsert applicationSettings;
flows:
  config_dev:
    steps:
      3:
        task: update_sharing_settings
      4:
        task: deploy_guest_sharing_rules
      5:
        task: adjust_custom_settings

orgs:
  scratch:
    dev:
      days: 14

